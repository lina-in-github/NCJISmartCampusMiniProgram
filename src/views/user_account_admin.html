<div class="stack">
  <form class="stack" method="post" action="/user/class">
    <div class="form-grid">
      <div class="field">
        <label class="label" for="class-name">@[strings/account_class_name]</label>
        <input class="input" id="class-name" name="name" type="text" maxlength="40" required placeholder="@[strings/account_class_name_placeholder]">
      </div>
      <div class="field">
        <label class="label" for="class-auth">@[strings/account_class_create_as]</label>
        <select class="select" id="class-auth" name="admin_auth_id">{class_opts}</select>
      </div>
      <div class="field full">
        <label class="label" for="class-desc">@[strings/account_class_desc]</label>
        <textarea class="textarea" id="class-desc" name="desc" maxlength="500" placeholder="@[strings/account_class_desc_placeholder]"></textarea>
      </div>
    </div>
    <div><button class="btn primary" type="submit">{plus}@[strings/account_class_create]</button></div>
  </form>
  <div class="divider"></div>
  <form class="stack" id="mode-form">
    <div class="form-grid">
      {mode_admin_select}
      <div class="field">
        <label class="label" for="mode-name">@[strings/account_mode_name]</label>
        <input class="input" id="mode-name" type="text" maxlength="60" required placeholder="@[strings/account_mode_name_placeholder]">
      </div>
      <div class="field">
        <label class="label" for="mode-display-name">@[strings/account_mode_display_name]</label>
        <input class="input" id="mode-display-name" type="text" maxlength="60" placeholder="@[strings/account_mode_display_name_placeholder]">
      </div>
      <div class="field full">
        <label class="label" for="mode-extends">@[strings/account_mode_extends]</label>
        <input class="input" id="mode-extends" type="text" maxlength="400" placeholder="@[strings/account_mode_extends_placeholder]">
        <span class="hint">@[strings/account_mode_extends_hint]</span>
      </div>
      <div class="field full">
        <span class="label">@[strings/account_mode_inherit_visibility]</span>
        <div class="check-row" id="mode-visibility-extends">
          <label class="check"><input type="checkbox" data-extend-mode="hidden"> @[strings/account_mode_flag_hidden]</label>
          <label class="check"><input type="checkbox" data-extend-mode="teacher only"> @[strings/account_mode_flag_teacher_only]</label>
          <label class="check"><input type="checkbox" data-extend-mode="admin only"> @[strings/account_mode_flag_admin_only]</label>
          <label class="check"><input type="checkbox" data-extend-mode="invisible"> @[strings/account_mode_flag_invisible]</label>
          <label class="check"><input type="checkbox" data-extend-mode="separate list"> @[strings/account_mode_flag_separate]</label>
        </div>
        <span class="hint">@[strings/account_mode_visibility_inherit_hint]</span>
      </div>
      <div class="field full">
        <label class="check"><input type="checkbox" id="mode-abstract"> @[strings/account_mode_flag_abstract]</label>
        <span class="hint">@[strings/account_mode_abstract_hint]</span>
      </div>
    </div>
    <div><button class="btn outline" type="submit">{plus}@[strings/account_mode_create]</button></div>
    <div class="member-result" id="mode-result" hidden></div>
  </form>
  {mode_manage_link}
  <div class="divider"></div>
  <form class="stack" id="member-form">
    <div class="form-grid">
      {admin_select}
      <div class="field">
        <label class="label" for="member-kind">@[strings/account_member_role]</label>
        <select class="select" id="member-kind">
          <option value="Student">@[strings/role_student]</option>
          <option value="Teacher">@[strings/role_teacher]</option>
          <option value="Admin">@[strings/role_admin]</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="member-quantity">@[strings/account_member_quantity]</label>
        <input class="input" id="member-quantity" type="number" min="1" max="100" value="1">
      </div>
    </div>
    <div><button class="btn outline" type="submit">{key}@[strings/account_member_generate]</button></div>
    <div class="member-result" id="member-result" hidden></div>
    <p class="hint">@[strings/account_member_note]</p>
  </form>
</div>
